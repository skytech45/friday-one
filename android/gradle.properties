org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# This host is aarch64: the Android SDK build-tools are x86_64 and run under
# qemu, so give Gradle room and avoid spawning many emulated aapt2 processes.
org.gradle.workers.max=2
