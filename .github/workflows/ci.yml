# FRIDAY One CI (plan v2.0): the legacy server suite was removed with the
# legacy stack; gates now cover the cloud components + Android build + secrets.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  cloud:
    name: typecheck (gateway, connector, control-plane)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [gateway, connector, control-plane]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
        working-directory: ${{ matrix.component }}
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.component }}
      - name: unit tests
        if: matrix.component == 'gateway' || matrix.component == 'connector' || matrix.component == 'control-plane'
        run: npm test
        working-directory: ${{ matrix.component }}
      - name: connector bundle builds
        if: matrix.component == 'connector'
        run: bash build-release.sh 0.0.0-ci
        working-directory: connector

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle -p android :app:testDebugUnitTest --console=plain
      - run: gradle -p android :app:assembleRelease --console=plain

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
